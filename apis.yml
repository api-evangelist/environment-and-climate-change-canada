- aid: environment-and-climate-change-canada:ogc-api-features
  name: Environment and Climate Change Canada OGC API - Features
  description: 'A GeoServer-provided OGC API - Features endpoint on the same host. Probed anonymously on 2026-08-20:
    /collections?f=json returned HTTP 200 with a well-formed OGC API response containing ZERO collections, consistent
    with the unpopulated WMS. The endpoint conforms; there is nothing behind it.'
  humanURL: https://geo.ec.gc.ca/geoserver/ogc/features/v1

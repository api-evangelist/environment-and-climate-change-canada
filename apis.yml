apis:
- aid: environment-and-climate-change-canada:ogc-web-services
  name: Environment and Climate Change Canada OGC Web Services (WMS / WFS)
  description: 'An OGC-standard GeoServer at geo.ec.gc.ca. Probed anonymously on 2026-08-20: the WMS 1.3.0 GetCapabilities
    request returned HTTP 200 with a valid WMS_Capabilities document titled "ECCC Web Map Service" — but the document
    declares NO published layers, only the root Layer element, and a WFS 2.0.0 GetCapabilities request returned
    no feature types. The service is real and callable; it is not populated on this host. Recorded as presence without
    content rather than as coverage — ECCC''s substantive open geospatial data is distributed through other federal
    surfaces, which are not profiled here yet.'
  humanURL: https://geo.ec.gc.ca/
  baseURL: https://geo.ec.gc.ca/geoserver/ows

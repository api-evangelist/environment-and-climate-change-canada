description: Environment and Climate Change Canada (ECCC) is the federal department responsible for weather, climate,
  water and environmental protection in Canada, and operates the Meteorological Service of Canada. It runs an OGC-standard
  GeoServer at geo.ec.gc.ca which responds correctly to WMS, WFS and OGC API - Features requests but, when probed
  on 2026-08-20, published no layers, no feature types and no collections through it.
